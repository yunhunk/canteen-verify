# ============================================================
# 食堂核销系统 · 前端 nginx
# 结构：80 端口（HTTP，兼作 certbot 验证）+ 443 端口（HTTPS）
# 证书由宿主机 certbot webroot 签发进 /etc/letsencrypt（只读挂载）
#
# 挂载要求：
#   ./nginx/security-headers.conf → /etc/nginx/conf.d/security-headers.conf
# ============================================================

# ---------- HTTP：ACME 验证 + 其余全部 301 到 HTTPS ----------
server {
    listen       80;
    server_name  _;

    # certbot webroot 验证路径（续期不需要停服务）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 签发证书前（443 不可用时）可临时注释下面这行，让 80 直接服务
    location / {
        return 301 https://$host$request_uri;
    }

    server_tokens off;
}

# ---------- HTTPS：正式入口 ----------
server {
    listen       443 ssl;
    http2        on;
    server_name  tuancan.gengle.xyz;

    # 证书路径（与宿主机 certbot 签发域名一致）
    ssl_certificate     /etc/letsencrypt/live/tuancan.gengle.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuancan.gengle.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # 会话复用，降低握手开销
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全响应头（片段，含 CSP；各处 add_header 层级都需 include）──
    # 注意：nginx 中某层级一旦声明 add_header，父级 add_header 便不再继承，
    # 因此本文件每处出现 add_header 的层级都必须 include 此片段。
    include /etc/nginx/conf.d/security-headers.conf;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 带哈希的静态资源：长缓存
    # add_header 会覆盖父级，故此处必须重新 include 安全头片段，
    # 否则 nosniff/HSTS/CSP 等全部丢失（历史缺陷，已修复）。
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # API 反代 —— 前端全部用相对路径 /api，转到 api 容器（compose 服务名）
    location /api/ {
        proxy_pass         http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;

        # ⚠️ 客户端 IP 传递必须用「覆写」而非「追加」语义
        #
        # 历史缺陷：此处曾是 $proxy_add_x_forwarded_for（追加语义）。
        # 攻击者自带 `X-Forwarded-For: 1.2.3.4`，nginx 转发后变成
        # `1.2.3.4, <真实IP>`；而后端旧代码取 XFF 首段，拿到的
        # 完全是攻击者可控的伪造值 —— 设备核销限流（按 IP）形同虚设，
        # 审计日志里的 IP 也被污染。
        #
        # 现在 X-Real-IP 用 $remote_addr（覆写，可信），
        # X-Forwarded-For 同样覆写为 $remote_addr 而非追加，
        # 使后端无论读哪个头都只能拿到真实对端地址。
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # SPA 路由：找不到的路径回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}
