# ══════════════════════════════════════════════════════════════
#  安全响应头片段（被 server 级与各 location 级共同 include）
#
#  ⚠️ 为什么不直接都写在 server 块里：
#     nginx 的 add_header 是「层级覆盖」语义 —— 只要某个 location
#     自己声明了**任何一个** add_header，父级的 add_header 就**全部**
#     不再继承。`location /assets/` 因为要加 Cache-Control，导致
#     整个静态资源目录丢失了 nosniff / HSTS 等安全头。
#     抽成片段后，每个声明 add_header 的层级都 include 一次，
#     新增 location 时也不会再踩这个坑。
# ══════════════════════════════════════════════════════════════

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── Content-Security-Policy ──
# 管理端把 JWT 放在 localStorage，任何 XSS 都能直接读走令牌，
# 因此 CSP 是限制脚本来源的第一道防线。
#
# 说明：
#   script-src 'self'          —— 禁止内联脚本与外部脚本域（Vite 构建产物均为外链 js）
#   style-src 'self' 'unsafe-inline'
#                              —— Element Plus 运行时注入行内样式，必须放开 unsafe-inline；
#                                 这是样式而非脚本，风险可控
#   img-src 'self' data:       —— 允许 data URI 图标
#   connect-src 'self'         —— XHR/fetch 仅允许同源（前端走相对路径 /api）
#   frame-ancestors 'self'     —— 等价 X-Frame-Options，兼容现代浏览器
#   object-src 'none'          —— 禁用 Flash/插件
#   base-uri 'self'            —— 防 <base> 标签劫持相对路径
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
