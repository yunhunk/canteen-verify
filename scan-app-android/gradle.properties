# JVM 参数：Kotlin 编译在 Gradle 守护进程里跑，内存给小了会 OOM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 并行构建，加速
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX 必须开启，否则 camera / lifecycle 等库无法编译
android.useAndroidX=true

# 本工程路径含中文（…\WorkBuddy\设计\…），跳过 AGP 的非 ASCII 路径检查。
# 若后续编译在 aapt2 环节报诡异的 file not found，把工程整体复制到纯英文路径再编
android.overridePathCheck=true

# AGP 8.5 官方支持到 compileSdk 34；35 仅为满足 CameraX 1.4 的 16KB 对齐要求，
# 实测可正常编译，压制版本检查警告
android.suppressUnsupportedCompileSdk=35

# native 库按 16KB 页对齐打包（Android 15+ 设备兼容性要求）
android.bundle.enableNativeLibraryPageAlignment=true

# Kotlin 代码风格
kotlin.code.style=official

# 关闭 BuildConfig 的按需生成限制（本工程需要读自定义字段，暂用不到，保持默认即可）
android.nonTransitiveRClass=true
